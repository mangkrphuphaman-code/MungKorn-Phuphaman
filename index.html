<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>มังกรภูผ่าม่าน รีสอร์ท</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+Thai:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4EF;--card:#fff;--ink:#17261F;--mute:#5D6F66;--line:#D9E0D8;--g:#1F4D3F;--g2:#2F7A62;--gold:#E0A526;--gold-ink:#33240A;--hot:#B83A2B;--ok:#16794F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1814;--card:#16251F;--ink:#E8F0EA;--mute:#98AEA3;--line:#2A4036;--g:#7CC7A6;--g2:#4FA683}}
:root[data-theme="dark"]{--bg:#0E1814;--card:#16251F;--ink:#E8F0EA;--mute:#98AEA3;--line:#2A4036;--g:#7CC7A6;--g2:#4FA683}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 "Noto Sans Thai",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:1080px;margin:auto;color:#fff}
.logo{font:800 20px "Noto Serif Thai",serif}
.link{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
.hero{position:relative;background:linear-gradient(180deg,#0F2E27 0%,#1F4D3F 55%,#2F7A62 100%);color:#fff;padding:110px 20px 120px;overflow:hidden}
.hero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px}
.hero>div{position:relative;max-width:1080px;margin:auto}
.hero h1{font:800 clamp(34px,7vw,64px)/1.2 "Noto Serif Thai",serif;margin:0 0 10px}
.hero p{margin:0;max-width:30em;opacity:.92;font-size:18px}
.search{max-width:1080px;margin:-64px auto 0;background:var(--card);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;box-shadow:0 12px 32px rgba(15,46,39,.22);position:relative;z-index:3;border:1px solid var(--line)}
.search label{display:block;font-size:13px;color:var(--mute)}
.search input,.search select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;font-weight:700;padding:12px 24px;cursor:pointer;align-self:end}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:var(--g2);color:#fff}
.err{color:var(--hot);font-size:14px;min-height:22px;max-width:1080px;margin:6px auto 0;padding:0 20px}
main{max-width:1080px;margin:8px auto 40px;padding:0 20px}
h2.s{font:800 26px "Noto Serif Thai",serif;margin:22px 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:150px;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative}
.pic b{position:absolute;top:10px;left:10px;font:500 13px "Noto Sans Thai";background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 10px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{margin:0;font:800 20px "Noto Serif Thai",serif}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.meta{color:var(--mute);font-size:14px}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.rooms i{font-style:normal;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--bg)}
.rooms i.x{text-decoration:line-through;opacity:.5}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:end;gap:8px;padding-top:8px}
.price{font:800 26px "Noto Serif Thai",serif;line-height:1.1}
.small{font-size:13px;color:var(--mute)}.left{font-size:13px;font-weight:500;color:var(--ok)}.left.no{color:var(--hot)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:18px;color:var(--mute);font-size:14px}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,15,11,.65)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.dh h2{margin:0;font-size:20px}.x{background:none;border:0;font-size:28px;cursor:pointer;line-height:1}
.db{padding:16px 20px}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.pick label{border:1px solid var(--line);border-radius:8px;padding:6px 16px;cursor:pointer;font-weight:500}
.pick label:has(input:checked){border-color:var(--g2);background:color-mix(in srgb,var(--g2) 16%,transparent)}
.pick input{position:absolute;opacity:0}.pick label:has(input:focus-visible){outline:3px solid var(--gold)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.full{grid-column:1/-1}
.form label{font-size:13px;color:var(--mute)}.form input,.form textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sum{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.sum p{display:flex;justify-content:space-between;margin:2px 0;gap:10px}
.sum .t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.ok{text-align:center}.code{font:800 32px "Noto Serif Thai",serif;color:var(--ok);letter-spacing:2px}
.bk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.bk button{background:none;border:1px solid var(--hot);color:var(--hot);border-radius:8px;padding:4px 12px;cursor:pointer}
.step{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.sc{display:flex;align-items:center;gap:12px}.sc output{min-width:24px;text-align:center;font-weight:700;font-size:18px}
.sc button{width:36px;height:36px;border-radius:50%;border:1px solid var(--g2);background:var(--card);font-size:20px;cursor:pointer;line-height:1}
.sc button:disabled{opacity:.35;cursor:not-allowed}
.qr{width:240px;height:240px;margin:12px auto;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;color:var(--mute);font-size:14px;background:#fff}
.qr img{max-width:100%;max-height:100%}
.search>div{min-width:0}
.search input,.search select{min-width:0;max-width:100%;height:46px;font-size:16px;-webkit-appearance:none;appearance:none;text-align:left;display:block}
.search input::-webkit-date-and-time-value{text-align:left;margin:0}
.search select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.pic{height:auto;aspect-ratio:1178/1390;padding:0;display:block}
.th{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px 4px 0}
.th button{position:relative;aspect-ratio:4/3;padding:0;border:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff;font-weight:700}
.pic .em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px}
.sl{position:relative;z-index:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;height:100%;scrollbar-width:none}
.sl::-webkit-scrollbar{display:none}.s{flex:0 0 100%;scroll-snap-align:center;height:100%}
.s img{width:100%;height:100%;object-fit:cover;display:block}
.pic>b{z-index:2}
.nv{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#17261F;font-size:20px;line-height:1;cursor:pointer}
.nv.zm{top:8px;right:8px;transform:none;width:32px;height:32px;font-size:16px}
.nv.l{left:8px}.nv.r{right:8px}
.ct{position:absolute;right:8px;bottom:8px;z-index:2;font:500 12px "Noto Sans Thai";background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 8px}
.pic.nop .nv,.pic.nop .ct{display:none}
#lb{width:min(98vw,calc(96vh*1178/1390));aspect-ratio:1178/1390;max-height:none;background:#000;color:#fff;padding:0;border-radius:12px;overflow:hidden}
#lb img{position:absolute;inset:0;display:block;width:100%;height:100%;max-height:none;object-fit:contain}
#lb .x{position:absolute;top:6px;right:10px;z-index:3;color:#fff;font-size:30px}
.promo{font-size:14px;font-weight:500;color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 38%,transparent);border-radius:8px;padding:4px 10px;margin:4px 0}
.pill{font-size:12px;background:color-mix(in srgb,var(--gold) 30%,transparent);border-radius:20px;padding:0 10px}
.addr{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:22px}
.addr svg{display:block;width:100%;height:100%;min-height:200px}
.addr .at{padding:16px 18px}.addr h3{margin:0 0 6px;font:800 20px "Noto Serif Thai",serif}.addr .btn{display:inline-block;text-decoration:none;margin-top:10px}
.memo{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;text-align:left;font-size:14px}
.memo b{display:block;font-size:16px;margin:2px 0 6px}.memo button{border:1px solid var(--g2);background:none;color:var(--g2);border-radius:8px;padding:2px 12px;cursor:pointer}
@media(max-width:820px){.addr{grid-template-columns:1fr}}
@media(max-width:820px){.search{grid-template-columns:repeat(2,minmax(0,1fr));margin:-64px 12px 0}.search>div:nth-child(3){grid-column:1/-1}.search .btn{grid-column:1/-1}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(10px);opacity:0}}}
</style>
</head>
<body>
<header><div class="logo">มังกรภูผ่าม่าน</div><button class="link" id="myBk">การจองของฉัน</button></header>
<section class="hero">
<div><h1>มังกรภูผ่าม่าน รีสอร์ท</h1><p>ห้องพัก 9 ห้อง ใน 3 รูปแบบ สำหรับคู่รักและครอบครัว เลือกวันที่เข้าพักแล้วดูห้องว่างได้ทันที</p></div>
<svg viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 150V95L110 40l90 55 120-75 130 90 110-60 140 70 120-80 150 80 100-50 130 60V150z" fill="#17261F" opacity=".35"/><path d="M0 150V120l140-50 110 50 150-70 130 60 160-60 140 70 130-40 140 50V150z" fill="var(--bg)"/></svg>
</section>

<form class="search" onsubmit="return false">
  <div><label for="ci">เช็คอิน</label><input type="date" id="ci"></div>
  <div><label for="co">เช็คเอาท์</label><input type="date" id="co"></div>
  <div><label for="gu">ผู้เข้าพัก</label><select id="gu"></select></div>
  <button class="btn" id="go">ดูห้องว่าง</button>
</form>
<div class="err" id="serr" role="alert"></div>

<main>
  <h2 class="s">ห้องพักของเรา</h2>
  <p class="sub" id="sub"></p>
  <div class="grid" id="grid"></div>
  <section class="addr" aria-label="ที่อยู่รีสอร์ท">
<svg viewBox="0 0 520 260" role="img" aria-label="ภาพประกอบตำแหน่งรีสอร์ท ริมถนนโยธาธิการ ขก. 2071"><rect width="520" height="260" fill="#DCF3E0"/><path d="M360 0V120L430 160V260H520V0z" fill="#F3F1F1"/><path d="M0 178L520 150" stroke="#fff" stroke-width="10"/><path d="M0 178L520 150" stroke="#D3DAE0" stroke-width="2" stroke-dasharray="1 0"/><path d="M200 168V250M200 225L300 240" stroke="#fff" stroke-width="5" fill="none"/>
<text x="24" y="52" font-size="14" fill="#7A4FB0" font-family="Noto Sans Thai,sans-serif">หลงเขา คาเฟ่ @ภูผาม่าน</text><text x="300" y="130" font-size="14" fill="#C2479F" font-family="Noto Sans Thai,sans-serif">บ้านผาสุข</text><text x="24" y="204" font-size="12" fill="#4A5A63" font-family="Noto Sans Thai,sans-serif">ถนนโยธาธิการ ขก. 2071</text>
<g transform="translate(250,164)"><path d="M0 0C-14-18-16-30-16-38a16 16 0 1 1 32 0c0 8-2 20-16 38z" fill="#D9534A"/><circle cy="-38" r="6" fill="#A93A33"/></g>
<text x="500" y="250" font-size="10" fill="#4A5A63" text-anchor="end" font-family="Noto Sans Thai,sans-serif">ภาพประกอบตำแหน่ง</text></svg>
<div class="at"><h3>ที่ตั้งรีสอร์ท</h3><div>📍 ที่อยู่: ประเทศไทย, จังหวัดขอนแก่น · Phu Pha Man · Ban Wang Kok Kaeo</div><a class="btn" id="mapA" target="_blank" rel="noopener">เปิดใน Google Maps</a></div></section>
</main>
<dialog id="dlg"><div id="dc"></div></dialog>
<dialog id="lb" aria-label="รูปขนาดเต็ม"><button class="x" id="lbx" aria-label="ปิด">×</button><img id="lbi" alt=""><button type="button" class="nv l" id="lbp" aria-label="รูปก่อนหน้า">‹</button><button type="button" class="nv r" id="lbn" aria-label="รูปถัดไป">›</button><span class="ct" id="lbc"></span></dialog>

<script>
const T=[
{id:1,n:"สวีท เลิฟ",e:"💞",rooms:["M1","M3","M6"],cap:2,ex:1,p:2390,g:"#2F7A62,#E0A526",promo:"ฟรีอาหารเช้า + หมูกระทะ 1 ชุด"},
{id:2,n:"สวีท วิลล่า",e:"🏡",rooms:["M2","M7"],cap:2,ex:1,p:2890,g:"#1F4D3F,#2F7A62",promo:"ฟรีอาหารเช้า + หมูกระทะ 1 ชุด"},
{id:3,n:"แฟมิลี่ วิลล่า",e:"👨‍👩‍👧‍👦",rooms:["M4-5","M8-9"],cap:4,ex:2,p:4990,g:"#0F2E27,#E0A526",desc:"1 หลังมี 2 ห้องนอน 2 ห้องน้ำ",promo:"ฟรีอาหารเช้า + หมูกระทะ 2 ชุด"}
];
const $=s=>document.querySelector(s),dlg=$("#dlg");
const fmt=n=>Math.round(n).toLocaleString("th-TH");
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const EXTRA=600;
const IMG={
1:["https://i.ibb.co/fYGjjy5w/IMG-0236.jpg","https://i.ibb.co/1JMcSPXJ/IMG-0237.jpg","https://i.ibb.co/Z60wk9pT/IMG-0240.jpg","https://i.ibb.co/ycxgM25Q/IMG-0239.jpg","https://i.ibb.co/Q38twDDm/IMG-0238.jpg"],
2:["https://i.ibb.co/2YmH1TDx/IMG-0246.jpg","https://i.ibb.co/zhjqp9W0/IMG-0252.jpg","https://i.ibb.co/62yM7VS/IMG-0253.jpg","https://i.ibb.co/LXtQ7t0J/IMG-0249.jpg","https://i.ibb.co/pr1FK3T5/IMG-0250.jpg"],
3:["https://i.ibb.co/xq7Fg4KN/IMG-0241.jpg","https://i.ibb.co/pBqSPKXX/IMG-7299.jpg","https://i.ibb.co/bj4gWbWZ/IMG-7298.jpg","https://i.ibb.co/BV9sgxpp/IMG-0245.jpg","https://i.ibb.co/TDFycdf0/IMG-0242.jpg","https://i.ibb.co/JRTb4JVt/IMG-0244.jpg","https://i.ibb.co/pjcxvCkp/IMG-0243.jpg"]};
let lbT=1,lbI=0;
function lbShow(){const a=IMG[lbT];lbI=(lbI+a.length)%a.length;document.getElementById("lbi").src=a[lbI];document.getElementById("lbc").textContent=(lbI+1)+"/"+a.length}
function lbOpen(t,i){lbT=t;lbI=i;lbShow();document.getElementById("lb").showModal()}
function qrBad(i){i.parentNode.innerHTML='<a href="'+QR_SRC+'" target="_blank" rel="noopener">เปิดรูป QR Code ในแท็บใหม่</a>'}
function copyBk(c,b){const k=load().find(x=>x.code===c);if(!k)return;
  const t=`รหัสการจอง: ${k.code}\nห้อง: ${k.room} (${k.type})\nเช็คอิน: ${ds(k.ci)}\nเช็คเอาท์: ${ds(k.co)}`;
  const ok=()=>{b.textContent="คัดลอกแล้ว"};
  const fb=()=>{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(_){}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(_){fb()}}
function imgBad(i){const p=i.closest(".pic");i.remove();if(!p.querySelector(".sl img"))p.classList.add("nop")}
const QR_SRC="https://i.ibb.co/FkmBHR8D/IMG-7662.jpg"; /* วางรูป QR Code ที่นี่ เช่น "data:image/png;base64,..." */
const MAP_URL="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("ถนนโยธาธิการ ขก.2071 ภูผาม่าน ขอนแก่น"); /* เปลี่ยนเป็นลิงก์ปักหมุดของรีสอร์ท */
const ACCT={bank:"",name:"",no:""}; /* ชื่อธนาคาร / ชื่อบัญชี / เลขบัญชี (ไม่บังคับ) */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ds=s=>new Date(s+"T00:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
const nts=()=>Math.round((new Date($("#co").value)-new Date($("#ci").value))/864e5);
const load=()=>{try{return JSON.parse(localStorage.getItem("mk_bk2")||"[]")}catch(_){return[]}};
const save=a=>{try{localStorage.setItem("mk_bk2",JSON.stringify(a))}catch(_){}};
const free=(r,ci,co,B)=>!B.some(b=>b.room===r&&ci<b.co&&co>b.ci);
let cur=null,mem=[];

for(let i=1;i<=6;i++)$("#gu").add(new Option(i+" ท่าน",i));$("#gu").value=2;
const now=new Date();$("#ci").min=iso(now);$("#co").min=iso(new Date(now.getTime()+864e5));
$("#ci").value=iso(new Date(now.getTime()+3*864e5));$("#co").value=iso(new Date(now.getTime()+4*864e5));

function ok(){const ci=$("#ci").value,co=$("#co").value;
  const m=!ci||!co?"เลือกวันเช็คอินและเช็คเอาท์ให้ครบก่อนดูห้องว่าง":ci<iso(new Date())?"ไม่สามารถเลือกวันเช็คอินที่ผ่านมาแล้ว":nts()<1?"วันเช็คเอาท์ต้องหลังวันเช็คอินอย่างน้อย 1 คืน":"";
  $("#serr").textContent=m;return !m}

function render(){
  if(!ok()){$("#grid").innerHTML="";$("#sub").textContent="แก้วันเข้าพักด้านบนเพื่อดูห้องว่าง";return}
  const ci=$("#ci").value,co=$("#co").value,n=nts(),g=+$("#gu").value,B=load();
  $("#sub").textContent=`${ds(ci)} – ${ds(co)} · ${n} คืน · ${g} ท่าน`;
  $("#grid").innerHTML=T.map(t=>{
    const av=t.rooms.filter(r=>free(r,ci,co,B)),fit=g<=t.cap+t.ex,can=fit&&av.length>0,xb=Math.max(0,g-t.cap);
    const st=!fit?`<div class="left no">รองรับสูงสุด ${t.cap+t.ex} ท่าน</div>`:av.length?`<div class="left">ว่าง ${av.length} จาก ${t.rooms.length} ${t.id===3?"หลัง":"ห้อง"}</div>`:`<div class="left no">เต็มในวันที่เลือก</div>`;
    return `<article class="card"><div class="pic" style="background:linear-gradient(135deg,${t.g})"><span class="em">${t.e}</span><div class="sl" tabindex="0" aria-label="รูปห้อง ${t.n}">${IMG[t.id].map((u,i)=>`<div class="s"><img src="${u}" alt="${t.n} รูปที่ ${i+1}" ${i?'loading="lazy"':""} onerror="imgBad(this)"></div>`).join("")}</div>
    <b>${t.id===3?"2 หลัง":t.rooms.length+" ห้อง"}</b><button type="button" class="nv l" aria-label="รูปก่อนหน้า">‹</button><button type="button" class="nv r" aria-label="รูปถัดไป">›</button><button type="button" class="nv zm" aria-label="ดูรูปขนาดเต็ม">⤢</button><span class="ct">1/${IMG[t.id].length}</span></div>
    <div class="th">${IMG[t.id].slice(0,4).map((u,i)=>`<button type="button" aria-label="ดูรูปที่ ${i+1}"><img src="${u}" alt="" loading="lazy" onerror="this.parentNode.remove()">${i===3&&IMG[t.id].length>4?`<span>+${IMG[t.id].length-4}</span>`:""}</button>`).join("")}</div>
    <div class="cb"><h3>${t.n}</h3><div class="stars" aria-label="3 ดาว">★★★</div>
    <div class="meta">👤 พักได้ ${t.cap} ท่าน · ➕ เสริมเตียงได้ ${t.ex} ท่าน</div>
    <div class="rooms" aria-label="หมายเลขห้อง">${t.rooms.map(r=>`<i class="${av.includes(r)?"":"x"}">${r}</i>`).join("")}</div>
    ${t.desc?`<div class="small">🛏️ ${t.desc}</div>`:""}<div class="promo">🎁 โปรโมชั่น: ${t.promo}</div><div class="small">เตียงเสริม ฿${EXTRA} / เตียง / คืน</div>${xb?`<div class="small">ต้องเสริมเตียง ${xb} เตียง สำหรับ ${g} ท่าน</div>`:""}
    <div class="foot"><div><div class="price">฿${fmt(t.p)}</div><div class="small">/ คืน · รวม ฿${fmt(t.p*n)}</div>${st}</div>
    <button class="btn" data-t="${t.id}" ${can?"":"disabled"}>จองห้องนี้</button></div></div></article>`}).join("");
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>book(+b.dataset.t));
  document.querySelectorAll(".pic").forEach((p,ti)=>{const sl=p.querySelector(".sl"),ct=p.querySelector(".ct"),n=sl.children.length;
    p.querySelector(".l").onclick=()=>sl.scrollBy({left:-sl.clientWidth,behavior:"smooth"});
    p.querySelector(".r").onclick=()=>sl.scrollBy({left:sl.clientWidth,behavior:"smooth"});
    const th=p.parentNode.querySelector(".th");if(th)th.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{if(i===3&&n>4)lbOpen(T[ti].id,3);else sl.scrollTo({left:i*sl.clientWidth,behavior:"smooth"})});
    sl.style.cursor="pointer";sl.title="แตะด้านขวาเพื่อดูรูปถัดไป แตะด้านซ้ายเพื่อย้อนกลับ";
    sl.onclick=e=>{const r=sl.getBoundingClientRect(),i=Math.round(sl.scrollLeft/sl.clientWidth),k=(e.clientX-r.left>=r.width/2?i+1:i-1+n)%n;sl.scrollTo({left:k*sl.clientWidth,behavior:"smooth"})};
    p.querySelector(".zm").onclick=()=>lbOpen(T[ti].id,Math.round(sl.scrollLeft/sl.clientWidth));
    sl.onscroll=()=>{ct.textContent=(Math.round(sl.scrollLeft/sl.clientWidth)+1)+"/"+n}});
}

function book(id){
  if(!ok())return;
  cur=T.find(t=>t.id===id);const ci=$("#ci").value,co=$("#co").value,n=nts(),g=+$("#gu").value;
  const B=load(),av=cur.rooms.filter(r=>free(r,ci,co,B)),minX=Math.max(0,g-cur.cap);let xb=minX;
  $("#dc").innerHTML=`<div class="dh"><div><h2>${cur.n}</h2><div class="small">${ds(ci)} – ${ds(co)} (${n} คืน) · ${g} ท่าน</div></div><button class="x" aria-label="ปิด" onclick="dlg.close()">×</button></div>
  <form class="db" id="bf" novalidate><b>${cur.id===3?"เลือกหลัง":"เลือกหมายเลขห้อง"}</b>
  <div class="pick" role="radiogroup">${av.map((r,i)=>`<label><input type="radio" name="rm" value="${r}" ${i?"":"checked"}>${r}</label>`).join("")}</div>
  <div class="promo">🎁 โปรโมชั่น: ${cur.promo}</div><div class="step"><div><b>เตียงเสริม</b><div class="small">฿${EXTRA} / เตียง / คืน · เสริมได้สูงสุด ${cur.ex} เตียง</div></div>
  <div class="sc"><button type="button" id="mn" aria-label="ลดเตียงเสริม">−</button><output id="xn">0</output><button type="button" id="pl" aria-label="เพิ่มเตียงเสริม">+</button></div></div>
  <div class="form"><div class="full"><label for="nm">ชื่อ-นามสกุลผู้เข้าพัก</label><input id="nm" autocomplete="name"></div>
  <div><label for="ph">เบอร์โทร</label><input id="ph" type="tel" autocomplete="tel"></div>
  <div><label for="em">อีเมล (ไม่บังคับ)</label><input id="em" type="email" autocomplete="email"></div>
  <div class="full"><label for="rq">คำขอพิเศษ</label><textarea id="rq" rows="2"></textarea></div></div>
  <div class="sum" id="sm"></div>
  <div class="err" id="ferr" style="padding:0;margin:0 0 8px"></div>
  <button class="btn g" style="width:100%" type="submit">ยืนยันการจองและชำระเงิน</button></form>`;
  const up=()=>{const xt=EXTRA*xb*n,tot=cur.p*n+xt;$("#xn").textContent=xb;$("#mn").disabled=xb<=minX;$("#pl").disabled=xb>=cur.ex;
    $("#sm").innerHTML=`<p><span>฿${fmt(cur.p)} × ${n} คืน</span><span>฿${fmt(cur.p*n)}</span></p>${xb?`<p><span>เตียงเสริม ${xb} เตียง × ${n} คืน</span><span>฿${fmt(xt)}</span></p>`:""}<p class="t"><span>ยอดชำระที่พักรวม</span><span>฿${fmt(tot)}</span></p><p class="small"><span>มีค่าประกัน 1,000 บาท ต่อหลัง</span></p>`;return tot};
  up();$("#mn").onclick=()=>{xb--;up()};$("#pl").onclick=()=>{xb++;up()};
  $("#bf").onsubmit=e=>{e.preventDefault();
    const nm=$("#nm").value.trim(),ph=$("#ph").value.trim(),em=$("#em").value.trim();
    if(!ok())return $("#ferr").textContent="วันเข้าพักไม่ถูกต้อง ปิดหน้านี้แล้วแก้วันที่ก่อน";
    if(!nm)return $("#ferr").textContent="กรอกชื่อ-นามสกุลผู้เข้าพัก";
    if(ph.replace(/\D/g,"").length<9)return $("#ferr").textContent="เบอร์โทรต้องมีอย่างน้อย 9 หลัก";
    if(em&&!/^\S+@\S+\.\S+$/.test(em))return $("#ferr").textContent="อีเมลไม่ถูกต้อง ตัวอย่าง: name@email.com";
    const room=document.querySelector("[name=rm]:checked").value,all=load();
    if(!free(room,ci,co,all)){$("#ferr").textContent="ห้องนี้เพิ่งถูกจอง เลือกห้องอื่น";return}
    const k={code:"MK"+Math.random().toString(36).slice(2,7).toUpperCase(),room,type:cur.n,ci,co,n,g,nm,ph,rq:$("#rq").value.trim(),tot:up(),xb};
    all.unshift(k);save(all);render();pay(k)};
  dlg.showModal();
}

function pay(k){
  $("#dc").innerHTML=`<div class="dh"><h2>ชำระเงินเต็มจำนวน</h2><button class="x" aria-label="ปิด" onclick="dlg.close()">×</button></div>
  <div class="db ok"><div class="small">รหัสการจอง</div><div class="code">${k.code}</div><button type="button" class="btn g" style="margin:6px 0" onclick="copyBk('${k.code}',this)">คัดลอกรหัสการจอง</button>
  <p><b>${k.type} · ${k.room}</b><br>${ds(k.ci)} – ${ds(k.co)} (${k.n} คืน)<br>${esc(k.nm)} · ${k.g} ท่าน${k.xb?` · เตียงเสริม ${k.xb}`:""}</p>
  <div class="small">ยอดที่ต้องชำระ</div><div class="price">฿${fmt(k.tot)}</div>
  <div class="memo">ตอนโอนเงิน กรุณาระบุบันทึกช่วยจำว่า<b id="memoT">ผู้จองรายใหม่ ${esc(k.nm)}</b><button type="button" onclick="try{navigator.clipboard.writeText(document.getElementById('memoT').textContent);this.textContent='คัดลอกแล้ว'}catch(_){}">คัดลอก</button></div>
  <div class="qr">${QR_SRC?`<img src="${QR_SRC}" alt="QR Code ชำระเงินของมังกรภูผ่าม่าน รีสอร์ท" onerror="qrBad(this)">`:"พื้นที่วางรูป QR Code ของรีสอร์ท"}</div>
  ${ACCT.no?`<p class="small">${esc(ACCT.bank)} · ${esc(ACCT.name)} · ${esc(ACCT.no)}</p>`:""}
  <p class="small">มีค่าประกัน 1,000 บาท ต่อหลัง</p><p class="small">สแกน QR Code เพื่อชำระเต็มจำนวน แล้วส่งสลิปพร้อมคัดลอกรหัสการจองให้รีสอร์ทเพื่อยืนยัน</p>
  <button class="btn g" onclick="dlg.close()">ปิด</button></div>`;
  if(!dlg.open)dlg.showModal();
}

function mine(){const a=load();
  $("#dc").innerHTML=`<div class="dh"><h2>การจองของฉัน</h2><button class="x" aria-label="ปิด" onclick="dlg.close()">×</button></div><div class="db">
  ${a.length?a.map(k=>`<div class="bk"><div><b>${k.type} · ${k.room}</b> <span class="pill">รอชำระเงิน</span><br><span class="small">${k.code} · ${ds(k.ci)} – ${ds(k.co)} · ฿${fmt(k.tot)}</span></div><div style="display:flex;gap:6px"><button data-q="${k.code}" style="border-color:var(--g2);color:var(--g2)">QR ชำระเงิน</button><button data-c="${k.code}">ยกเลิก</button></div></div>`).join(""):'<p class="small">ยังไม่มีการจอง เลือกวันที่แล้วกด "จองห้องนี้" ได้เลย</p>'}</div>`;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{save(load().filter(k=>k.code!==b.dataset.c));render();mine()});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>pay(load().find(k=>k.code===b.dataset.q)));
  if(!dlg.open)dlg.showModal();
}

$("#mapA").href=MAP_URL;$("#myBk").onclick=mine;$("#go").onclick=render;
const bump=()=>{const d=new Date($("#ci").value+"T00:00:00");d.setDate(d.getDate()+1);const m=iso(d);$("#co").min=m;if(!$("#co").value||$("#co").value<m)$("#co").value=m};
$("#ci").onchange=()=>{if($("#ci").value)bump();render()};
["co","gu"].forEach(i=>$("#"+i).onchange=render);
const lb=document.getElementById("lb");
document.getElementById("lbx").onclick=()=>lb.close();
document.getElementById("lbp").onclick=()=>{lbI--;lbShow()};
document.getElementById("lbn").onclick=()=>{lbI++;lbShow()};
const lbImg=document.getElementById("lbi");let tx=0;
lbImg.style.cursor="pointer";
lbImg.onclick=e=>{const r=lbImg.getBoundingClientRect();lbI+=(e.clientX-r.left<r.width/2)?-1:1;lbShow()};
lb.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40){lbI+=d<0?1:-1;lbShow()}},{passive:true});
lb.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){lbI--;lbShow()}else if(e.key==="ArrowRight"){lbI++;lbShow()}});
lb.addEventListener("click",e=>{if(e.target===lb)lb.close()});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
render();
</script>
</body>
</html>
